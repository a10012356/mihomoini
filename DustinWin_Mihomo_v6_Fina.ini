; ============================================================
; DustinWin Mihomo / ShellCrash v6 定制版
; SubConverter / subconverter .ini
;
; 基于：DustinWin_v6.yaml
; 目标：生成可被 Mihomo / Clash Meta 使用的订阅配置
;
; 与 v6 保持：
;   🚀 节点选择
;   ♻️ 自动选择
;   ⚡ 故障转移
;   ⚖️ 负载均衡
;   🎯 全球直连
;   🛑 广告拦截
;   🐟 漏网之鱼
;
; 规则顺序：
;   private -> ads -> apple-cn -> microsoft-cn -> google-cn
;   -> telegramip -> gfw -> proxy -> cn -> privateip -> cnip
;   -> GEOIP,CN -> FINAL
;
; 说明：
;   标准 SubConverter 的 .ini 规则模板使用 clash-domain /
;   clash-ipcidr 文本规则集。DustinWin 官方 .ini 模板也是
;   这一方式，而不是直接把 .mrs 当作 SubConverter 输入。
;
;   fakeip-filter.mrs 不在这里作为 routing ruleset 加入：
;   它在 v6 中的用途是 DNS Fake-IP real-ip 过滤，不是流量分流。
;   如果把它写成普通 ruleset，会错误地把其中域名加入 DIRECT/
;   PROXY 路由规则。它应继续由 Mihomo/ShellCrash 的 DNS 配置管理。
;
;   原 v6 的 load-balance strategy: consistent-hashing 无法由
;   标准 custom_proxy_group INI 语法表达，因此这里只生成
;   load-balance 组；如要强制 consistent-hashing，应在最终
;   Mihomo YAML 中保留 strategy: consistent-hashing。
; ============================================================

[custom]

; ============================================================
; DustinWin Domain Rules
; 使用官方 domain-list-custom 的文本规则集
; ============================================================

; ① 私有域名：必须最先处理
ruleset=🎯 全球直连,clash-domain:https://ghproxy.net/https://github.com/DustinWin/domain-list-custom/releases/download/domains/private.list,86400

; ② 广告
ruleset=🛑 广告拦截,clash-domain:https://ghproxy.net/https://github.com/DustinWin/domain-list-custom/releases/download/domains/ads.list,86400

; ③ Apple 中国服务
ruleset=🎯 全球直连,clash-domain:https://ghproxy.net/https://github.com/DustinWin/domain-list-custom/releases/download/domains/apple-cn.list,86400

; ④ Microsoft 中国服务
ruleset=🎯 全球直连,clash-domain:https://ghproxy.net/https://github.com/DustinWin/domain-list-custom/releases/download/domains/microsoft-cn.list,86400

; ⑤ Google 中国服务
; 按 v6 YAML 保持为代理，而不是直连。
ruleset=🚀 节点选择,clash-domain:https://ghproxy.net/https://github.com/DustinWin/domain-list-custom/releases/download/domains/google-cn.list,86400

; ⑥ Telegram IP
ruleset=🚀 节点选择,clash-ipcidr:https://ghproxy.net/https://github.com/DustinWin/geoip/releases/download/ips/telegramip.list,86400

; ⑦ GFW
ruleset=🚀 节点选择,clash-domain:https://ghproxy.net/https://github.com/DustinWin/domain-list-custom/releases/download/domains/gfw.list,86400

; ⑧ Proxy
ruleset=🚀 节点选择,clash-domain:https://ghproxy.net/https://github.com/DustinWin/domain-list-custom/releases/download/domains/proxy.list,86400

; ⑨ 中国域名
ruleset=🎯 全球直连,clash-domain:https://ghproxy.net/https://github.com/DustinWin/domain-list-custom/releases/download/domains/cn.list,86400

; ⑩ 私有 IP
ruleset=🎯 全球直连,clash-ipcidr:https://ghproxy.net/https://github.com/DustinWin/geoip/releases/download/ips/privateip.list,86400

; ⑪ 中国 IP
ruleset=🎯 全球直连,clash-ipcidr:https://ghproxy.net/https://github.com/DustinWin/geoip/releases/download/ips/cnip.list,86400

; ⑫ 中国 GeoIP
ruleset=🎯 全球直连,[]GEOIP,CN

; ⑬ 最终兜底
ruleset=🐟 漏网之鱼,[]FINAL


; ============================================================
; Proxy Groups
; ============================================================

; 主节点选择
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚡ 故障转移`[]⚖️ 负载均衡`.*`[]DIRECT

; 自动测速
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50

; 故障转移
custom_proxy_group=⚡ 故障转移`fallback`.*`https://www.gstatic.com/generate_204`300

; 负载均衡
; 标准 INI 无法直接写入 strategy: consistent-hashing。
custom_proxy_group=⚖️ 负载均衡`load-balance`.*`https://www.gstatic.com/generate_204`300

; 国内/指定直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择

; 广告拦截
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT

; 漏网之鱼
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]⚡ 故障转移`[]⚖️ 负载均衡`[]DIRECT

; ============================================================
; Generator
; ============================================================

enable_rule_generator=true
overwrite_original_rules=true
