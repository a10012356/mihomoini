; 重要：不再使用 Cloudflare CIDR / GEOIP,cloudflare 特殊分流
; 避免 Cloudflare 承载的国外网站被误判为直连

; 中国大陆 IP
ruleset=🎯 全球直连,[]GEOIP,CN

; 最终：未匹配流量走代理
ruleset=🐟 漏网之鱼,[]FINAL


;========================
; 分组
;========================

; 主控制组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚡ 故障转移`[]⚖️ 负载均衡`[]☑️ 手动选择

; 自动选择：所有节点参与测速
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 故障转移：按顺序使用节点，故障自动切换
custom_proxy_group=⚡ 故障转移`fallback`.*`http://www.gstatic.com/generate_204`300,,50

; 负载均衡：所有节点参与负载均衡
custom_proxy_group=⚖️ 负载均衡`load-balance`.*`http://www.gstatic.com/generate_204`300,,50

; 手动选择：显示所有节点
custom_proxy_group=☑️ 手动选择`select`.*

; 国内直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; 广告
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT

; 漏网之鱼默认代理
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]⚡ 故障转移`[]⚖️ 负载均衡`[]☑️ 手动选择`[]DIRECT

; Google FCM 保留名称兼容性
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择

;========================
; 配置
;========================

enable_rule_generator=true
overwrite_original_rules=true

;luck
