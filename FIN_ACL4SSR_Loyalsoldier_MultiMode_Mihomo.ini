; Loyalsoldier Style MultiMode - Mihomo / ShellCrash
; 基于 Loyalsoldier 规则集，适配 Mihomo 后端
;
; 设计目标：
; - 规则更新勤快、精简高效
; - 国内域名 + 中国 IP 优先直连
; - 苹果 / iCloud 直连（符合你之前的要求）
; - 广告拦截独立
; - 自动测速 + 故障转移 + 负载均衡
; - 漏网之鱼可选择代理或直连
;
; 注意：这是 Clash/Mihomo .ini 后端，仅用于 Mihomo / ShellCrash / Subconverter

[custom]
; ========== 局域网 / 私有地址 ==========
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt

; ========== 广告拦截 ==========
ruleset=🛑 广告拦截,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt

; ========== 苹果 / iCloud 直连 ==========
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt

; ========== 常见软件直连 ==========
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt

; ========== 国内域名直连 ==========
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt

; ========== 谷歌服务（默认走代理，可按需改） ==========
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt

; ========== Telegram ==========
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt

; ========== 代理列表（GFW + 需要代理的域名） ==========
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt

; ========== 中国大陆 IP 直连 ==========
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt

; ========== GEOIP 兜底 + 最终规则 ==========
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ========== 策略组 ==========
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚡ 故障转移`[]⚖️ 负载均衡`[]☑️ 手动选择`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⚡ 故障转移`fallback`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⚖️ 负载均衡`load-balance`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=☑️ 手动选择`select`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连

enable_rule_generator=true
overwrite_original_rules=true
